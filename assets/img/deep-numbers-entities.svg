<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 340" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Deep Numbers cosmic entity map</title>
  <desc id="desc">Pixel-art entities progressing from Earth through the outer Solar System and into deep space.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050718"/>
      <stop offset=".48" stop-color="#0b0a25"/>
      <stop offset="1" stop-color="#040510"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glowPurple"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glowBlue"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glowCyan"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1920" height="340" rx="26" fill="url(#bg)"/>
  <rect x="24" y="24" width="1872" height="292" rx="20" fill="none" stroke="#6475c8" stroke-opacity=".18"/>

  <!-- cosmic route -->
  <path d="M70 168 H1850" stroke="#7c3aed" stroke-opacity=".11" stroke-width="3"/>
  <path d="M85 168 H1830" stroke="url(#trail)" stroke-width="2" stroke-dasharray="3 13"/>

  <!-- stars -->
  <g fill="#dbeafe" opacity=".8">
    <rect x="74" y="58" width="3" height="3"/><rect x="211" y="92" width="2" height="2"/>
    <rect x="338" y="44" width="3" height="3"/><rect x="482" y="78" width="2" height="2"/>
    <rect x="640" y="52" width="3" height="3"/><rect x="817" y="91" width="2" height="2"/>
    <rect x="1032" y="52" width="2" height="2"/><rect x="1190" y="78" width="3" height="3"/>
    <rect x="1374" y="46" width="2" height="2"/><rect x="1536" y="84" width="3" height="3"/>
    <rect x="1710" y="56" width="2" height="2"/><rect x="1828" y="102" width="3" height="3"/>
  </g>

  <!-- Earth -->
  <g transform="translate(115 62)">
    <circle cx="55" cy="90" r="53" fill="#60a5fa" opacity=".12" filter="url(#glowBlue)"/>
    <circle cx="55" cy="90" r="48" fill="#182a76" stroke="#93c5fd" stroke-width="3"/>
    <path fill="#4ade80" d="M18 63h12v-8h14v9h10v12H42v9H30v9H20v-9h-8V74h6zm43-3h18v8h10v11H79v8H68V74h-7zm-17 47h11v10H44z"/>
    <circle cx="55" cy="90" r="40" fill="none" stroke="#bfdbfe" stroke-opacity=".25" stroke-width="2"/>
    <text x="55" y="160" fill="#dbeafe" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800">EARTH</text>
  </g>

  <!-- Mars -->
  <g transform="translate(270 62)">
    <circle cx="55" cy="90" r="53" fill="#ef4444" opacity=".12" filter="url(#glowPurple)"/>
    <circle cx="55" cy="90" r="47" fill="#9f3b3b" stroke="#fb7185" stroke-width="3"/>
    <rect x="24" y="67" width="11" height="9" fill="#7f2d2d"/><rect x="65" y="53" width="13" height="10" fill="#7f2d2d"/>
    <rect x="40" y="91" width="17" height="12" fill="#b4534d"/><rect x="71" y="105" width="11" height="8" fill="#7f2d2d"/>
    <rect x="17" y="101" width="9" height="7" fill="#b4534d"/>
    <text x="55" y="160" fill="#fda4af" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800">MARS</text>
  </g>

  <!-- Jupiter -->
  <g transform="translate(425 62)">
    <circle cx="55" cy="90" r="56" fill="#60a5fa" opacity=".12" filter="url(#glowBlue)"/>
    <circle cx="55" cy="90" r="50" fill="#c28b55" stroke="#bfdbfe" stroke-width="3"/>
    <path d="M12 70h86v11H12zm7 18h74v9H19zm-3 18h82v10H16z" fill="#e8c39e" opacity=".8"/>
    <rect x="66" y="86" width="21" height="11" fill="#b85f53"/>
    <rect x="31" y="47" width="34" height="7" fill="#9d6845"/>
    <text x="55" y="160" fill="#dbeafe" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800">JUPITER</text>
  </g>

  <!-- Saturn -->
  <g transform="translate(580 62)">
    <ellipse cx="55" cy="92" rx="75" ry="22" fill="none" stroke="#a78bfa" stroke-opacity=".4" stroke-width="7"/>
    <ellipse cx="55" cy="92" rx="72" ry="20" fill="none" stroke="#93c5fd" stroke-opacity=".3" stroke-width="3"/>
    <circle cx="55" cy="92" r="43" fill="#bfa16c" stroke="#fde68a" stroke-width="3"/>
    <path d="M18 85h74v7H18zm6 14h64v7H24z" fill="#f1d7a0" opacity=".7"/>
    <text x="55" y="160" fill="#fde68a" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800">SATURN</text>
  </g>

  <!-- Uranus -->
  <g transform="translate(735 62)">
    <circle cx="55" cy="90" r="53" fill="#67e8f9" opacity=".14" filter="url(#glowCyan)"/>
    <circle cx="55" cy="90" r="45" fill="#59cfe0" stroke="#a5f3fc" stroke-width="3"/>
    <path d="M25 74h60v8H25zm6 14h48v7H31zm-3 14h54v7H28z" fill="#baf7ff" opacity=".28"/>
    <text x="55" y="160" fill="#a5f3fc" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800">URANUS</text>
  </g>

  <!-- Neptune -->
  <g transform="translate(890 62)">
    <circle cx="55" cy="90" r="53" fill="#2563eb" opacity=".14" filter="url(#glowBlue)"/>
    <circle cx="55" cy="90" r="47" fill="#3154c5" stroke="#93c5fd" stroke-width="3"/>
    <path d="M17 69h76v8H17zm7 17h68v7H24zm-3 18h72v8H21z" fill="#9fb8ff" opacity=".3"/>
    <rect x="66" y="86" width="18" height="8" fill="#1e3a8a"/>
    <text x="55" y="160" fill="#bfdbfe" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800">NEPTUNE</text>
  </g>

  <!-- Pluto -->
  <g transform="translate(1045 62)">
    <circle cx="55" cy="90" r="51" fill="#c4b5fd" opacity=".1" filter="url(#glowPurple)"/>
    <circle cx="55" cy="90" r="38" fill="#9a7f91" stroke="#ddd6fe" stroke-width="3"/>
    <rect x="31" y="67" width="14" height="10" fill="#bda8ac"/><rect x="59" y="84" width="17" height="9" fill="#7f6875"/>
    <rect x="46" y="103" width="19" height="10" fill="#bda8ac"/>
    <text x="55" y="160" fill="#ddd6fe" text-anchor="middle" font-family="monospace" font-size="20" font-weight="800">PLUTO</text>
  </g>

  <!-- Kuiper Belt -->
  <g transform="translate(1200 62)">
    <ellipse cx="55" cy="90" rx="56" ry="44" fill="none" stroke="#60a5fa" stroke-opacity=".25" stroke-width="3"/>
    <g fill="#bfdbfe"><rect x="12" y="78" width="9" height="9"/><rect x="24" y="46" width="7" height="7"/><rect x="82" y="55" width="8" height="8"/><rect x="92" y="94" width="9" height="9"/><rect x="66" y="119" width="7" height="7"/><rect x="37" y="127" width="8" height="8"/></g>
    <circle cx="55" cy="90" r="18" fill="#7c3aed" opacity=".18"/>
    <text x="55" y="160" fill="#a5b4fc" text-anchor="middle" font-family="monospace" font-size="17" font-weight="800">KUIPER BELT</text>
  </g>

  <!-- Oort Cloud -->
  <g transform="translate(1355 62)">
    <circle cx="55" cy="90" r="58" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-width="3"/>
    <circle cx="55" cy="90" r="44" fill="none" stroke="#93c5fd" stroke-opacity=".15" stroke-width="2"/>
    <circle cx="55" cy="90" r="5" fill="#fff" filter="url(#glowCyan)"/>
    <g fill="#c4b5fd"><rect x="4" y="82" width="5" height="5"/><rect x="94" y="47" width="5" height="5"/><rect x="84" y="131" width="5" height="5"/><rect x="13" y="125" width="4" height="4"/></g>
    <text x="55" y="160" fill="#c4b5fd" text-anchor="middle" font-family="monospace" font-size="19" font-weight="800">OORT CLOUD</text>
  </g>

  <!-- Milky Way -->
  <g transform="translate(1510 62)">
    <ellipse cx="55" cy="90" rx="51" ry="31" fill="#7c3aed" opacity=".13" filter="url(#glowPurple)"/>
    <path d="M10 103c24-33 63-38 91-12M20 115c25-21 53-27 75-19" fill="none" stroke="#a78bfa" stroke-width="4"/>
    <circle cx="55" cy="90" r="6" fill="#fff"/>
    <g fill="#e0e7ff"><rect x="19" y="72" width="3" height="3"/><rect x="42" y="53" width="3" height="3"/><rect x="76" y="62" width="3" height="3"/><rect x="89" y="104" width="3" height="3"/></g>
    <text x="55" y="160" fill="#c4b5fd" text-anchor="middle" font-family="monospace" font-size="17" font-weight="800">MILKY WAY</text>
  </g>

  <!-- Andromeda -->
  <g transform="translate(1665 62)">
    <ellipse cx="55" cy="90" rx="54" ry="27" transform="rotate(-20 55 90)" fill="#60a5fa" opacity=".18" filter="url(#glowBlue)"/>
    <ellipse cx="55" cy="90" rx="48" ry="22" transform="rotate(-20 55 90)" fill="none" stroke="#93c5fd" stroke-width="3" stroke-opacity=".7"/>
    <circle cx="55" cy="90" r="7" fill="#fff"/>
    <g fill="#dbeafe"><rect x="22" y="77" width="3" height="3"/><rect x="81" y="71" width="3" height="3"/><rect x="90" y="107" width="3" height="3"/></g>
    <text x="55" y="160" fill="#bfdbfe" text-anchor="middle" font-family="monospace" font-size="17" font-weight="800">ANDROMEDA</text>
  </g>

  <!-- Deep Universe -->
  <g transform="translate(1820 62)">
    <rect x="15" y="50" width="80" height="80" fill="#7c3aed" opacity=".07" rx="10"/>
    <g stroke="#a78bfa" stroke-opacity=".65" stroke-width="2">
      <path d="M55 58v64M23 90h64M32 67l46 46M78 67l-46 46"/>
    </g>
    <g fill="#fff"><rect x="53" y="88" width="5" height="5"/><rect x="35" y="72" width="3" height="3"/><rect x="70" y="106" width="3" height="3"/></g>
    <text x="55" y="160" fill="#e9d5ff" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800">DEEP SPACE</text>
  </g>

  <g fill="#52618a" font-family="monospace" font-size="12" font-weight="800" letter-spacing="2">
    <text x="56" y="286">INNER SOLAR SYSTEM</text>
    <text x="925" y="286">OUTER SOLAR SYSTEM</text>
    <text x="1600" y="286">EXTRASOLAR / DEEP SPACE</text>
  </g>
</svg>
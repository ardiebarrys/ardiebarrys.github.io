function updatePlayer(){ $('#play').textContent=playing?'Ⅱ':'▶';$('#play').setAttribute('aria-label',playing?'Pause animation':'Play animation');$('#timeline').value=Math.round(time/TOTAL*1000); }
for(let i=0;i<9;i++){const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' '+chapters[i].short;b.addEventListener('click',()=>{follow=true;$('#follow').setAttribute('aria-pressed','true');go(i*DURATION+.05,false);});$('#chapters').append(b);}
function setScenario(value){persistent=value;announced=-1;$('#resolved').setAttribute('aria-pressed',!value);$('#persistent').setAttribute('aria-pressed',value);lastUI=-1;dirty=true;animateMechanism();}
$('#resolved').onclick=()=>setScenario(false);$('#persistent').onclick=()=>setScenario(true);
$('#play').onclick=()=>{if(time>=TOTAL-.01)time=0;playing=!playing;updatePlayer();dirty=true;};
$('#previous').onclick=()=>go(Math.max(0,stage-1)*DURATION+.05,false);
$('#next').onclick=()=>go(Math.min(8,stage+1)*DURATION+.05,false);
$('#replay').onclick=()=>{time=0;playing=true;follow=true;$('#follow').setAttribute('aria-pressed','true');updatePlayer();dirty=true;};
$('#timeline').oninput=e=>go(Number(e.target.value)/1000*TOTAL);
$('#speed').onchange=e=>{speed=+e.target.value;};
$('#labels').onclick=()=>{showLabels=!showLabels;$('#labels').setAttribute('aria-pressed',showLabels);$('#labels-layer').hidden=!showLabels;dirty=true;};
$('#follow').onclick=()=>{follow=!follow;$('#follow').setAttribute('aria-pressed',follow);if(follow){azimuth=.12;elevation=.13;}dirty=true;};
$('#overview').onclick=()=>{follow=false;$('#follow').setAttribute('aria-pressed','false');desiredTarget.set(0,0,0);desiredDistance=width<height?41:29;azimuth=.05;elevation=.06;dirty=true;};
function applyQuality(){const high=quality===2||(quality===0&&!software&&!matchMedia('(max-width:700px)').matches&&!(navigator.deviceMemory&&navigator.deviceMemory<=4));scene.traverse(g=>{if(g.userData.fineDetail)g.visible=high;});renderer.setPixelRatio(Math.min(devicePixelRatio,software?1:high?1.6:1));renderer.setSize(width,height,false);$('#quality').textContent=['Auto detail','Balanced','High detail'][quality];dirty=true;}
$('#quality').onclick=()=>{quality=(quality+1)%3;applyQuality();};
$('#fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await $('#app').requestFullscreen();else await document.exitFullscreen();}catch(e){$('#fullscreen').textContent='⛶';}};
$$('[data-focus]').forEach(b=>b.onclick=()=>{follow=false;$('#follow').setAttribute('aria-pressed',false);desiredTarget.copy(b.dataset.focus==='nrf'?mainNRF.position:b.dataset.focus==='keap'?points.keap:V(5,1,0));desiredDistance=b.dataset.focus==='nucleus'?12:8;dirty=true;});
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);follow=false;$('#follow').setAttribute('aria-pressed',false);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;azimuth-=(e.clientX-drag.x)*.006;elevation=clamp(elevation+(e.clientY-drag.y)*.004,-.8,.8);drag={x:e.clientX,y:e.clientY};dirty=true;});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('wheel',e=>{e.preventDefault();follow=false;$('#follow').setAttribute('aria-pressed',false);desiredDistance=clamp(desiredDistance*Math.exp(e.deltaY*.001),4,55);dirty=true;},{passive:false});
canvas.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('#play').click();}if(e.code==='ArrowRight'){e.preventDefault();$('#next').click();}if(e.code==='ArrowLeft'){e.preventDefault();$('#previous').click();}});
function resize(){const b=$('#viewport').getBoundingClientRect();width=Math.max(1,b.width);height=Math.max(1,b.height);camera.aspect=width/height;camera.updateProjectionMatrix();applyQuality();dirty=true;}
new ResizeObserver(resize).observe($('#viewport'));
document.addEventListener('visibilitychange',()=>{lastFrame=lastRender=performance.now();dirty=true;});
new IntersectionObserver(entries=>{offscreen=!entries[0].isIntersecting;lastFrame=lastRender=performance.now();dirty=true;},{threshold:0}).observe($('#viewport'));

function activityAt(s,bad){const rise=range(s,2,4.6),fall=range(s,6.3,8.9);return .08+.83*rise*(bad?1-.12*fall:1-.96*fall);}
function updateText(p){const d=chapterData();if(lastUI!==stage){$('#stage-number').textContent=String(stage+1).padStart(2,'0')+' / 09';$('#stage-title').textContent=d.title;$('#stage-copy').textContent=d.copy;$('#steps').replaceChildren();d.steps.forEach((t,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.textContent=t;b.onclick=()=>go((stage+i/3+.02)*DURATION);li.append(b);$('#steps').append(li);});$$('#chapters button').forEach((b,i)=>{b.classList.toggle('active',i===stage);b.setAttribute('aria-current',i===stage?'step':'false');});lastUI=stage;lastSub=-1;}
 if(announced!==stage){$('#arrival-number').textContent=String(stage+1).padStart(2,'0')+' / 09';$('#arrival-title').textContent=d.title;$('#arrival').classList.remove('enter');void $('#arrival').offsetWidth;$('#arrival').classList.add('enter');announced=stage;}
 substep=Math.min(2,Math.floor(p*3));if(lastSub!==substep){$$('#steps li').forEach((li,i)=>li.classList.toggle('active',i===substep));$('#action').textContent=d.steps[substep];$('#phase-number').textContent=String(stage+1).padStart(2,'0')+'.'+(substep+1);lastSub=substep;}
 const s=time/DURATION,a=activityAt(s,persistent);$('#activity-state').textContent=a<.25?'Low':s<4.7?'Rising':persistent&&s>6?'Sustained':s>6?'Declining':'High';
 let path='',ref='';for(let i=0;i<=90;i++){const t=i/10,x=8+t/9*240,y=79-activityAt(t,persistent)*70;if(t<=s+.1)path+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);ref+=(i?'L':'M')+x.toFixed(1)+' '+(79-activityAt(t,!persistent)*70).toFixed(1);}$('#activity-trace').setAttribute('d',path);$('#activity-trace').style.stroke=persistent&&stage>=6?'#f5a08b':'#7bd8b0';$('#reference-trace').setAttribute('d',ref);$('#reference-trace').style.opacity=stage>=6?'1':'0';$('#reference-trace').style.stroke=persistent?'#7bd8b080':'#f5a08b80';$('#activity-dot').setAttribute('cx',8+s/9*240);$('#activity-dot').setAttribute('cy',79-a*70);updatePlayer();
}
function animateMechanism(){const s=time/DURATION;stage=Math.min(8,Math.floor(s));const p=s-stage;
 const active=s>=2&&s<7.5||(persistent&&s>=2),reset=range(s,6.8,8.6),stressLevel=s<1?0:s<2?range(s,1,1.7):persistent?mix(1,.22,range(s,5,7)):1-range(s,5,6.8);
 const d=chapterData();if(follow){desiredTarget.fromArray(d.focus);desiredDistance=d.distance*(width<height?1.45:1);if(stage===3)desiredTarget.lerp(mainNRF.position,.33);}
 bound.visible=(s>=1&&s<7)||s>=8||persistent;nuclearNRF.visible=stage===7&&!persistent;nuclearNRF.scale.setScalar(1-range(s,7,7.8));
 keapSensing.forEach((o,i)=>{o.material=mat(stressLevel>.4?C.coral:C.gold,{emissive:stressLevel>.4?C.coral:C.gold,emissiveIntensity:stressLevel>.4?.4:.05});o.scale.setScalar(.09*(1+stressLevel*.35));});
 mainNRF.visible=true;mainNRF.scale.setScalar(1);mainNRF.rotation.set(0,0,0);ubiquitin.visible=false;
 if(stage===0){const a=range(p,.0,.23);mainNRF.position.copy(V(-6,2.2,2.8)).lerp(V(-4,1,2.5),a);if(p>.58)move(mainNRF,degradePath,range(p,.58,.88));ubiquitin.visible=p>.34&&p<.92;ubiquitin.scale.setScalar(range(p,.30,.49));mainNRF.scale.setScalar(1-range(p,.88,.99));bound.visible=false;}
 else if(stage===1){mainNRF.visible=false;}
 else if(stage===2){move(mainNRF,nrPath,range(p,.02,.8)*.36);mainNRF.scale.setScalar(range(p,.01,.21));}
 else if(stage===3){move(mainNRF,nrPath,.36+.64*range(p,.03,.96));mainNRF.rotation.z=-.12*range(p,.75,1);}
 else if(s<7||persistent){mainNRF.position.set(4.9,1.65,1.8);mainNRF.rotation.z=-.18;}
 else if(stage===7){move(mainNRF,degradePath,range(p,.36,.83));ubiquitin.visible=p>.23&&p<.88;ubiquitin.scale.setScalar(range(p,.18,.4));mainNRF.scale.setScalar(1-range(p,.83,.97));}
 else{mainNRF.visible=false;}
 pool.forEach((o,i)=>{const count=stage===2?Math.floor(p*7):active?7:0;o.visible=i<count;if(!o.visible)return;const phase=(time*.035+i*.145)%1;if(s<3)o.position.set(-6+i*.65,1.3+Math.sin(i*2.2)*1.15,2+Math.sin(i)*.3);else if(s<4)move(o,nrPath,clamp(.2+i*.06+p*.55));else{o.position.set(3.1+(i%3)*1.35,2.8-Math.floor(i/3)*1.5,1+Math.sin(i)*.35);if(i>3&&s<6)move(o,nrPath,.4+phase*.4);}o.position.y+=.05*Math.sin(time+i);o.scale.setScalar(.5*(persistent?1:1-reset));});
 zipper.visible=s>=4.2&&(persistent||s<7.8);zipper.scale.setScalar(range(s,4.2,4.6)*(persistent?1:1-range(s,7,7.8)));maf.visible=s>=4&&(persistent||s<7.8);maf.scale.setScalar(range(s,4,4.3)*(persistent?1:1-range(s,7,7.8)));polymerase.scale.setScalar(persistent?1:1-range(s,7,7.8));polymerase.visible=s>=4.5&&(persistent||s<7.8);polymerase.position.x=.6+.5*Math.sin(time*.45);
 mrna.forEach((o,i)=>{o.visible=s>=4.5&&(persistent||s<7.8);if(!o.visible)return;const phase=(time*.075+i*.20)%1;move(o,rnaPath,phase);o.scale.setScalar((.65+.4*Math.sin(phase*Math.PI))*(persistent?1:1-range(s,7.2,7.8))); });
 enzymes.forEach((o,i)=>{o.visible=s>=5.3;const birth=range(s,5.3+i*.08,5.55+i*.08);o.scale.setScalar(birth*.85);o.position.copy(V(-8,1.6,1.9)).lerp(V(-6+(i%4)*1.75,3.2-Math.floor(i/4)*3.7,2),range(s,5.35+i*.07,6.3+i*.03));o.position.y+=Math.sin(time*.5+i)*.035;});
 stress.forEach((o,i)=>{o.visible=stressLevel>.01&&i<Math.ceil(stressLevel*24);if(!o.visible)return;const cycle=(time*.07+i*.041)%1;const start=V(-11.5+Math.sin(i)*.8,4+Math.cos(i*2.4)*2,2+Math.sin(i)*.4),end=V(-4.3+Math.cos(i*2.4)*.9,.2+Math.sin(i*2.4)*.9,2.5);o.position.copy(start).lerp(end,range(s,1,2)*.6+cycle*.4);if(s>=5){const en=enzymes[i%7].position;o.position.lerp(en,range(s,5.5,6.6)*cycle);o.scale.setScalar(.5+.5*(1-cycle));}else o.scale.setScalar(1);});
 peptides.forEach((o,i)=>{const degrading=stage===0&&p>.8||stage===7&&!persistent&&p>.7;o.visible=degrading;if(degrading){const q=stage===0?range(p,.82,1):range(p,.72,1);o.position.set(-5.6+Math.sin(i*2.4)*q,-4.05-q*(.4+i*.07),2+Math.cos(i)*q*.4);o.scale.setScalar(.06*(1-q*.7));}});
 condensate.visible=s>=5.5;autophagosome.visible=s>=6;lysosome.visible=true;renewed.visible=s>=6.6&&!persistent;
 if(persistent){condensate.position.set(-.7,-2,1.8);condensate.scale.setScalar(.6+range(s,5.5,7)*.65);autophagosome.position.copy(condensate.position);autophagosome.scale.setScalar(.6);}
 else{const q=range(s,6.3,6.75);move(condensate,cargoPath,q);condensate.scale.setScalar((.6+.4*range(s,5.5,6.1))*(1-range(s,6.65,6.93)));autophagosome.position.copy(condensate.position);autophagosome.scale.setScalar(range(s,6.02,6.3)*(1-range(s,6.7,6.95)));renewed.position.copy(V(-2.6,-2.4,2)).lerp(V(-4,0,2),range(s,6.7,7.1));renewed.scale.setScalar(.6*range(s,6.6,6.85)*(1-range(s,7.1,7.4)));}
 resetParticles.forEach((o,i)=>{o.visible=!persistent&&s>=6.65&&s<7.3;const q=(time*.18+i/9)%1;o.position.copy(V(-2.6,-2.5,2)).lerp(V(-4,0,2),q);});
 if(stage===8){enzymes.forEach(o=>o.scale.setScalar(.85));}
 updateText(p);
}
function drawLabels(){const list=chapterData().labels,occupied=[];for(const [id,e] of Object.entries(labels)){leaders[id].style.display='none';let visible=showLabels&&list.includes(id);if(id==='maf')visible&&=maf.visible&&maf.scale.x>.25;if(id==='polymerase')visible&&=polymerase.visible;if(id==='nrf')visible&&=mainNRF.visible&&mainNRF.scale.x>.2;if(id==='ub')visible&&=ubiquitin.visible;if(id==='renewed')visible&&=renewed.visible;if(id==='autophagy')visible&&=autophagosome.visible&&autophagosome.scale.x>.2;if(id==='p62')visible&&=condensate.visible&&condensate.scale.x>.2;if(id==='rna')visible&&=mrna[0].visible;if(id==='enzyme')visible&&=enzymes[0].visible;if(id==='stress')visible&&=stress.some(o=>o.visible);if(!visible){e.hidden=true;continue;}let pos=id==='nrf'?mainNRF.position.clone():id==='ub'?mainNRF.position.clone().add(V(.4,.6,0)):id==='rna'?mrna[0].position.clone():id==='p62'?condensate.position.clone():id==='autophagy'?autophagosome.position.clone().add(V(0,-.8,0)):id==='renewed'?renewed.position.clone():points[id].clone();if(id==='maf')maf.getWorldPosition(pos);if(id==='polymerase')polymerase.getWorldPosition(pos);if(id==='are')are.getWorldPosition(pos);if(id==='rna'){const visibleRNA=mrna.find(o=>{const v=o.position.clone().project(camera);return Math.abs(v.x)<.85&&Math.abs(v.y)<.85;});if(visibleRNA)pos.copy(visibleRNA.position);}const anchor=pos.clone().project(camera);pos.y+=id==='proteasome'?-.8:.65;pos.project(camera);if(pos.z>1||Math.abs(pos.x)>1.1||Math.abs(pos.y)>1.1){e.hidden=true;continue;}e.hidden=false;const ew=e.offsetWidth||95,eh=e.offsetHeight||28;let x=clamp((pos.x+1)*width/2,ew/2+7,width-ew/2-7),y=clamp((1-pos.y)*height/2,40,height-22);for(let n=0;n<6;n++){if(!occupied.some(r=>Math.abs(x-r.x)<(ew+r.w)/2+5&&Math.abs(y-r.y)<eh+4))break;y=clamp(y+eh+5,40,height-20);}occupied.push({x,y,w:ew});e.style.left=x+'px';e.style.top=y+'px';const l=leaders[id];l.style.display='';l.setAttribute('x1',(anchor.x+1)*width/2);l.setAttribute('y1',(1-anchor.y)*height/2);l.setAttribute('x2',x);l.setAttribute('y2',y+((1-anchor.y)*height/2>y?eh/2:-eh/2));}}
function tick(now){requestAnimationFrame(tick);lastFrame=now;if(document.hidden||offscreen||!ResearchViewer.pageVisible){lastRender=now;return;}const interval=software?33:0;if(now-lastRender<interval)return;const elapsed=(now-lastRender)/1000;lastRender=now;if(playing){time=Math.min(TOTAL-.001,time+Math.min(elapsed,.1)*speed);dirty=true;if(time>=TOTAL-.001){playing=false;updatePlayer();}}
 const moving=target.distanceTo(desiredTarget)>.001||Math.abs(distance-desiredDistance)>.001;if(!dirty&&!moving)return;const start=performance.now();animateMechanism();const a=1-Math.exp(-Math.min(elapsed,.1)*3.6);target.lerp(desiredTarget,a);distance=mix(distance,desiredDistance,a);camera.position.copy(target).add(V(Math.sin(azimuth)*Math.cos(elevation)*distance,Math.sin(elevation)*distance,Math.cos(azimuth)*Math.cos(elevation)*distance));camera.lookAt(target);camera.updateMatrixWorld();renderer.render(scene,camera);drawLabels();dirty=false;
 if(!software&&quality===0){frameSum+=performance.now()-start;frameCounter++;if(frameCounter===120){if(frameSum/frameCounter>22){scene.traverse(g=>{if(g.userData.fineDetail)g.visible=false;});renderer.setPixelRatio(1);renderer.setSize(width,height,false);}frameCounter=0;frameSum=0;}}
}
resize();updatePlayer();requestAnimationFrame(tick);
// Read-only status is useful to verify the packaged viewer without altering the timeline.
window.nrf2Viewer={get state(){return {stage:stage+1,time,playing,persistent,renderer:software?'software':'webgl',labels:showLabels};}};

ResearchViewer.attach({root:$('#app'),kind:'nrf2',title:'NRF2–KEAP1 · Redox signal resolution',canvas,
 caption:()=>chapterData().title+' · '+chapterData().steps[Math.min(2,substep)],
 getState:()=>({time:+time.toFixed(3),persistent}),
 setState:s=>{setScenario(s.persistent===true);go(Number(s.time)||0);},
 render:()=>{animateMechanism();renderer.render(scene,camera);},labelElements:()=>[...document.querySelectorAll('.m-label')]});
</script></body></html>

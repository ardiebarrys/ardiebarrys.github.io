name: Deploy site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Generate CV PDF 📄
        # Prints the /cv/ page to PDF so the download button always matches the CV page.
        # If this step fails, the committed copy in assets/pdf is used instead.
        continue-on-error: true
        run: |
          python3 -m http.server 8080 --directory _site >/dev/null 2>&1 &
          sleep 2
          mkdir -p _site/assets/pdf
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=15000 \
            --print-to-pdf=_site/assets/pdf/Ardie_Barry_Sailis_CV.pdf \
            http://localhost:8080/cv/
          ls -la _site/assets/pdf/Ardie_Barry_Sailis_CV.pdf
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site

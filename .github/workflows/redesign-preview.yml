# TEMPORARY: builds the redesign branch and pushes the built site to the
# redesign-preview branch for local QA. GitHub Pages serves gh-pages only, so
# this never touches the live site. Delete this file before merging.
name: Redesign preview build

on:
  push:
    branches:
      - redesign

permissions:
  contents: write

concurrency:
  group: redesign-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Push preview branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: redesign-preview
          single-commit: true
